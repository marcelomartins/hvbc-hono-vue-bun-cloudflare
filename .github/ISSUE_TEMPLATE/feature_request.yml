name: Feature request
description: Propose a change, ideally before writing it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, and how it fits the architecture invariants in AGENTS.md.
    validations:
      required: true
