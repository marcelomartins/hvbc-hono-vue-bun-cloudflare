name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a clean checkout, with the failing command and its output.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Cloudflare Workers
        - Bun
        - Both
        - Local development only
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `bun --version` and `node --version`, and your operating system.
